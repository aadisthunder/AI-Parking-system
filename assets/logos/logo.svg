<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient / Shadow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>

    <!-- Theme Gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="signalGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Clean Minimalist White Container with subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#E2E8F0" stroke-width="6" filter="url(#softShadow)"/>

  <!-- Isometric / Perspective Parking Bay Slot Lines -->
  <g transform="translate(10, 15)">
    <!-- Base Bay Floor subtle highlight -->
    <path d="M140 370 L256 425 L372 370 L256 315 Z" fill="#F1F5F9" opacity="0.9"/>
    
    <!-- Parking Bay Boundary Lines -->
    <path d="M140 370 L256 425 L372 370" fill="none" stroke="#CBD5E1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Smart Sensor Node at Center of Bay -->
    <ellipse cx="256" cy="370" rx="42" ry="21" fill="url(#primaryGradient)" opacity="0.2"/>
    <ellipse cx="256" cy="370" rx="24" ry="12" fill="url(#primaryGradient)"/>
    <ellipse cx="256" cy="370" rx="10" ry="5" fill="#FFFFFF"/>

    <!-- Dynamic Smart 'P' Icon -->
    <!-- Stem of P -->
    <rect x="200" y="130" width="36" height="190" rx="18" fill="url(#primaryGradient)"/>

    <!-- Loop of P -->
    <path d="M220 130 H285 C335 130 365 158 365 200 C365 242 335 270 285 270 H220 Z" 
          fill="none" 
          stroke="url(#primaryGradient)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Wireless IoT / AI Sensor Waves (Upward / Connectivity) -->
    <!-- Wave 1 (Inner) -->
    <path d="M280 90 A 60 60 0 0 1 350 145" 
          fill="none" 
          stroke="url(#signalGradient)" 
          stroke-width="14" 
          stroke-linecap="round"/>

    <!-- Wave 2 (Outer) -->
    <path d="M305 60 A 95 95 0 0 1 395 135" 
          fill="none" 
          stroke="url(#signalGradient)" 
          stroke-width="14" 
          stroke-linecap="round" 
          opacity="0.75"/>
  </g>
</svg>
